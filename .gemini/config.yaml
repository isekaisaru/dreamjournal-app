# Gemini Code Assist（GitHub アプリ）の設定
# 公式: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
# アプリを入れるまでは何も起きません（このファイルは読まれるのを待っているだけ）。
have_fun: false
ignore_patterns:
  - "frontend/yarn.lock"
  - "backend/Gemfile.lock"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.webp"
code_review:
  disable: false
  # MEDIUM 以上だけコメントする（細かすぎる指摘で埋もれないように）
  comment_severity_threshold: MEDIUM
  # 1 回のレビューで最大 10 件まで（初学者が読み切れる量に）
  max_review_comments: 10
  pull_request_opened:
    help: false
    # PR を開いたら「何が変わったか」の要約も出す
    summary: true
    code_review: true
    include_drafts: true
