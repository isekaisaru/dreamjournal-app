name: Backend Docker Security

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-security.yml"

jobs:
  build-and-check:
    name: Docker build and secret exclusion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add non-secret sentinel files
        working-directory: ./backend
        run: |
          mkdir -p config/credentials
          printf '%s\n' 'docker-ignore-sentinel' > .env
          printf '%s\n' 'docker-ignore-sentinel' > config/master.key
          printf '%s\n' 'docker-ignore-sentinel' > config/credentials/production.key
          printf '%s\n' 'docker-ignore-sentinel' > private.pem

      - name: Build isolated test image
        working-directory: ./backend
        run: docker build --build-arg RAILS_ENV=test --tag yumetree-backend-secret-check .

      - name: Verify secret files are absent from image
        run: |
          docker run --rm --entrypoint sh yumetree-backend-secret-check -c '
            test ! -e /app/.env
            test ! -e /app/config/master.key
            test ! -e /app/config/credentials/production.key
            test ! -e /app/private.pem
          '
