name: Backend Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    name: RSpec
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: ./backend

      - name: Setup fresh database from structure.sql
        working-directory: ./backend
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
          bundle exec rails db:migrate

      - name: Verify RLS state
        working-directory: ./backend
        run: |
          bundle exec rails runner - <<'RUBY'
          expected_tables = %w[
            dream_profiles
            ai_usage_logs
            payments
            processed_webhook_events
            dream_image_generations
            checkout_attempts
          ]

          rows = ActiveRecord::Base.connection.exec_query(<<~SQL).to_a
            SELECT c.relname AS table_name,
                   c.relrowsecurity AS rls_enabled,
                   c.relforcerowsecurity AS force_rls,
                   COUNT(p.polname)::integer AS policy_count
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              LEFT JOIN pg_policy p ON p.polrelid = c.oid
             WHERE n.nspname = 'public'
               AND c.relname IN (#{expected_tables.map { |name| ActiveRecord::Base.connection.quote(name) }.join(', ')})
             GROUP BY c.relname, c.relrowsecurity, c.relforcerowsecurity
          SQL

          states = rows.index_by { |row| row.fetch("table_name") }
          invalid_tables = expected_tables.reject do |table_name|
            state = states[table_name]
            state && state.fetch("rls_enabled") && !state.fetch("force_rls") && state.fetch("policy_count").zero?
          end

          abort "Unexpected RLS state: #{invalid_tables.join(', ')}" if invalid_tables.any?
          puts "Verified default-deny RLS on #{expected_tables.length} tables"
          RUBY

      - name: Verify structure.sql regeneration
        working-directory: ./backend
        run: |
          pg_dump --version
          psql --version
          bundle exec rails runner 'puts "PostgreSQL server #{ActiveRecord::Base.connection.select_value("SHOW server_version")}"'

          original_structure=$(mktemp)
          generated_structure=$(mktemp)
          normalized_original=$(mktemp)
          normalized_generated=$(mktemp)
          git show HEAD:backend/db/structure.sql > "$original_structure"

          cleanup() {
            cp "$original_structure" db/structure.sql
            rm -f "$original_structure" "$generated_structure" "$normalized_original" "$normalized_generated"
          }
          trap cleanup EXIT

          bundle exec rails db:schema:dump
          cp db/structure.sql "$generated_structure"

          ruby - "$original_structure" "$generated_structure" "$normalized_original" "$normalized_generated" <<'RUBY'
          public_schema_block = <<~'SQL'
            --
            -- Name: public; Type: SCHEMA; Schema: -; Owner: -
            --

            -- *not* creating schema, since initdb creates it


          SQL

          def normalize(source_path, destination_path, public_schema_block)
            content = File.binread(source_path)
            block_count = content.scan(public_schema_block).length
            abort "#{source_path}: public schema block appeared #{block_count} times" if block_count > 1

            content = content.sub(public_schema_block, "")
            trailing_newlines = content[/\n*\z/].length
            unless (1..2).cover?(trailing_newlines)
              abort "#{source_path}: expected 1 or 2 trailing newlines, got #{trailing_newlines}"
            end

            content = content.delete_suffix("\n") if trailing_newlines == 2
            File.binwrite(destination_path, content)
            puts "#{source_path}: public_schema_blocks=#{block_count}, trailing_blank_lines=#{trailing_newlines - 1}"
          end

          normalize(ARGV.fetch(0), ARGV.fetch(2), public_schema_block)
          normalize(ARGV.fetch(1), ARGV.fetch(3), public_schema_block)
          RUBY

          diff -u "$normalized_original" "$normalized_generated"
          cleanup
          trap - EXIT
          git diff --exit-code -- db/structure.sql

      - name: Run tests
        working-directory: ./backend
        run: |
          bundle exec rspec
